name: CI & Production Build Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Production Build Check (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://costadeoro.curiol.studio'
          BUNNY_LIBRARY_ID: '629005'
