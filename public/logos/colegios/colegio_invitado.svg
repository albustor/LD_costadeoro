<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <path d="M100 15 L170 45 C170 120 100 175 100 175 C100 175 30 120 30 45 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" stroke-linejoin="round"/>
  <!-- Inner Border Line -->
  <path d="M100 27 L158 52 C158 114 100 160 100 160 C100 160 42 114 42 52 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Central Gold Star -->
  <polygon points="100,55 112,82 142,84 118,103 126,132 100,116 74,132 82,103 58,84 88,82" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
  <!-- Banner / Monogram text -->
  <text x="100" y="152" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">INVITADO</text>
</svg>
