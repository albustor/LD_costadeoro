<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vit-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="vit-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-vit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Escudo Heráldico Monseñor Vittorino Girardi -->
  <path d="M100 18 L164 42 V105 C164 146, 134 172, 100 186 C66 172, 36 146, 36 105 V42 L100 18 Z" fill="url(#vit-blue)" stroke="url(#vit-gold)" stroke-width="6" filter="url(#shadow-vit)"/>

  <!-- Cruz Episcopal Dorada -->
  <path d="M100 38 V88 M82 52 H118" stroke="url(#vit-gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Libro Abierto de Sabiduría y Valores Cristianos -->
  <path d="M60 102 C 75 94, 92 98, 100 106 C 108 98, 125 94, 140 102 V142 C 125 134, 108 134, 100 142 C 92 134, 75 134, 60 142 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="100" y1="106" x2="100" y2="142" stroke="#94A3B8" stroke-width="2"/>
  <line x1="68" y1="114" x2="94" y2="114" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="124" x2="94" y2="124" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="114" x2="132" y2="114" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="124" x2="132" y2="124" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Antorcha de la Verdad -->
  <circle cx="100" cy="94" r="6" fill="#F59E0B"/>
  <path d="M96 98 L104 98 L102 106 L98 106 Z" fill="#D97706"/>

  <!-- Texto de Identidad Institucional -->
  <text x="100" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#FDE047" text-anchor="middle">VITTORINO</text>
  <text x="100" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="#E2E8F0" text-anchor="middle">HUACAS</text>
</svg>
