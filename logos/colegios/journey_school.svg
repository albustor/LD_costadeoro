  <circle cx="100" cy="100" r="10" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
  <text x="100" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#FEF3C7" text-anchor="middle">THE JOURNEY</text>
</svg>
