      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow-tjs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#tjs-bg)" filter="url(#shadow-tjs)"/>
  <circle cx="100" cy="100" r="76" stroke="#FEF3C7" stroke-width="5" stroke-dasharray="6 6"/>
